[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-memory-corridor"
version = "0.3.0"
description = "Durable agent memory capture, fresh hybrid recall, explicit corrections, resume state, and verified non-deleting mirrors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["memory", "retrieval", "rag", "hybrid-search", "rrf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "rank-bm25>=0.2.2",
    "dateparser>=1.1.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
graph = [
    "scipy>=1.10",
]
semantic = [
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
    "torch",  # CPU build is fine; GPU optional
]
dev = [
    "pytest>=7",
]

[project.scripts]
hmc = "helix_memory.cli:main"
helix-memory-corridor = "helix_memory.cli:main"

[project.urls]
Homepage = "https://github.com/CjPetersonIX/helix-memory-corridor"
Repository = "https://github.com/CjPetersonIX/helix-memory-corridor"

[tool.setuptools.packages.find]
where = ["."]
include = ["helix_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
